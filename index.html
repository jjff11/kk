<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f3f6fa">
<title>坐看云起</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.7.0/style.css" media="print" onload="this.media='all'">
<style>
:root{--bg:#f3f6fa;--card:#fff;--line:#e2e8f0;--txt:#1e2b37;--sub:#7a8896;--acc:#3d7bd9;--acc-d:#2f68c0;--acc2:#6aa6ff;--ok:#2fb579;--warn:#f0a020;--bad:#e5484d}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
.hidden{display:none!important}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.ic.fill{fill:currentColor;stroke:none}
i[data-ic]{display:inline-flex}
body.host .g-only{display:none!important}
body.guest .h-only{display:none!important}
body.guest #btnPlay{display:none}
body.guest #prog{pointer-events:none}
body.guest #prog::-webkit-slider-thumb{opacity:0}
body.guest #prog::-moz-range-thumb{opacity:0}

/* ── 登录页 ── */
#setup{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;overflow-x:hidden;overflow-y:auto;
  background:radial-gradient(60% 50% at 12% 8%,#dce9ff 0,transparent 70%),radial-gradient(55% 50% at 92% 90%,#e0f3ea 0,transparent 70%),linear-gradient(#f7fafd,#edf2f8)}
#setup::before,#setup::after{content:"";position:absolute;border-radius:50%;background:#fff;filter:blur(40px);opacity:.85;pointer-events:none;animation:drift 26s ease-in-out infinite alternate}
#setup::before{width:380px;height:160px;left:-60px;top:12%}
#setup::after{width:460px;height:180px;right:-100px;bottom:10%;animation-duration:34s;animation-direction:alternate-reverse}
@keyframes drift{to{transform:translateX(70px)}}
.card{position:relative;width:100%;max-width:380px;margin:auto;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:32px 24px 26px;display:flex;flex-direction:column;gap:20px;box-shadow:0 12px 44px rgba(60,100,160,.12)}
.brand{text-align:center}
.mark{width:54px;height:54px;margin:0 auto 14px;border-radius:17px;display:flex;align-items:center;justify-content:center;color:#fff;background:linear-gradient(135deg,#86b8ff,var(--acc));box-shadow:0 8px 20px rgba(61,123,217,.3)}
.mark .ic{width:30px;height:30px;stroke-width:1.6}
.brand h1{font-family:"LXGW WenKai","霞鹜文楷","KaiTi","楷体","STKaiti","Kaiti SC",serif;font-size:30px;font-weight:500;letter-spacing:8px;text-indent:8px}
.brand p{margin-top:8px;font-size:12.5px;color:var(--sub);letter-spacing:1px}
.field label{display:block;font-size:12px;color:var(--sub);margin-bottom:8px}
.row{display:flex;gap:8px;align-items:center}
.field input{flex:1;min-width:0;width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:#f7f9fc;color:var(--txt);font-size:15px;outline:none;transition:border-color .2s,box-shadow .2s,background .2s}
.field input:focus{border-color:var(--acc);background:#fff;box-shadow:0 0 0 3px rgba(61,123,217,.15)}
.ghost{padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:#f7f9fc;color:var(--sub);font-size:13px;white-space:nowrap;transition:all .15s}
.ghost:hover{color:var(--acc);border-color:var(--acc)}
.seg{display:flex;gap:4px;padding:4px;border-radius:13px;background:#eef2f7}
.seg button{flex:1;padding:9px 8px;border-radius:10px;color:var(--sub);font-size:14px;font-weight:500;line-height:1.4;transition:all .18s}
.seg button small{display:block;font-size:11px;font-weight:400;opacity:.8}
.seg button.on{background:#fff;color:var(--txt);box-shadow:0 2px 8px rgba(30,60,100,.1)}
.drop{display:flex;flex-direction:column;align-items:center;gap:6px;border:1.5px dashed #c9d5e2;border-radius:14px;padding:18px 12px;background:#f9fbfd;color:var(--sub);font-size:13px;text-align:center;cursor:pointer;transition:all .15s;word-break:break-all}
.drop .ic{width:26px;height:26px;color:var(--acc)}
.drop small{font-size:11.5px;opacity:.85}
.drop:hover{border-color:var(--acc);background:#f3f8ff}
.drop.has{border-style:solid;border-color:var(--acc);background:#f3f8ff;color:var(--txt)}
#goBtn{width:100%;padding:14px;border-radius:13px;background:var(--acc);color:#fff;font-size:15px;font-weight:600;letter-spacing:2px;box-shadow:0 8px 20px rgba(61,123,217,.3);transition:all .15s}
#goBtn:hover{background:var(--acc-d)}
#goBtn:disabled{opacity:.45;box-shadow:none;cursor:default}
.err{min-height:16px;text-align:center;font-size:13px;color:var(--bad)}
.tip{text-align:center;font-size:12px;color:var(--sub);line-height:1.7}

/* ── 播放页 ── */
#player{position:fixed;inset:0;background:#06090d;color:#fff;user-select:none;-webkit-user-select:none}
#v{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:transparent}
#hint{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:rgba(255,255,255,.55);font-size:14px;letter-spacing:.5px;pointer-events:none;text-align:center;padding:0 30px}
#hint .ic{width:48px;height:48px;stroke-width:1.2;animation:float 4s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-8px)}}
#tap{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;align-items:center;gap:8px;padding:13px 26px;border-radius:30px;background:var(--acc);color:#fff;font-size:15px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.45)}

.top,.bottom{position:absolute;left:0;right:0;display:flex;transition:opacity .25s}
.top{top:0;justify-content:space-between;align-items:center;gap:10px;padding:calc(12px + env(safe-area-inset-top)) 14px 28px;background:linear-gradient(rgba(0,0,0,.55),transparent)}
.bottom{bottom:0;flex-direction:column;gap:2px;padding:30px 14px calc(8px + env(safe-area-inset-bottom));background:linear-gradient(transparent,rgba(0,0,0,.7))}
#player.idle .top,#player.idle .bottom{opacity:0;pointer-events:none}
#player.idle{cursor:none}

.pill,.chip{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 13px;border-radius:17px;background:rgba(14,20,28,.55);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);color:#fff;font-size:12.5px;white-space:nowrap}
.pill{min-width:0}
.pill span{overflow:hidden;text-overflow:ellipsis}
.chip .ic{width:16px;height:16px}
button.chip:hover{background:rgba(60,72,90,.75)}
.chip.on{color:#7be0b0}
.dot{width:8px;height:8px;border-radius:50%;background:#667;flex-shrink:0;transition:all .3s}
.dot.green{background:var(--ok);box-shadow:0 0 8px var(--ok)}
.dot.yellow{background:var(--warn);box-shadow:0 0 8px var(--warn)}
.dot.red{background:var(--bad);box-shadow:0 0 8px var(--bad)}
.grp{display:flex;align-items:center;gap:6px;flex-shrink:0}

#prog{-webkit-appearance:none;appearance:none;width:100%;height:18px;background:transparent;cursor:pointer;outline:none}
#prog::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:linear-gradient(to right,var(--acc2) var(--p,0%),rgba(255,255,255,.28) var(--p,0%))}
#prog::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;margin-top:-4.5px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.4);transition:transform .15s}
#prog:hover::-webkit-slider-thumb{transform:scale(1.25)}
#prog::-moz-range-track{height:4px;border-radius:2px;background:rgba(255,255,255,.28)}
#prog::-moz-range-progress{height:4px;border-radius:2px;background:var(--acc2)}
#prog::-moz-range-thumb{width:13px;height:13px;border:0;border-radius:50%;background:#fff}
.ctrl{display:flex;align-items:center;gap:4px}
.ctrl button{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-width:40px;height:40px;padding:0 10px;border-radius:12px;color:#fff;transition:background .15s}
.ctrl button:hover{background:rgba(255,255,255,.14)}
.ctrl button.txt{font-size:13px}
.ctrl .ic{width:22px;height:22px}
.ctrl button.txt .ic{width:18px;height:18px}
#clock{font-size:12.5px;color:rgba(255,255,255,.8);margin-left:6px;font-variant-numeric:tabular-nums}
.sp{flex:1}

#toast{position:absolute;left:50%;bottom:96px;transform:translateX(-50%) translateY(10px);padding:9px 18px;border-radius:20px;background:rgba(20,28,38,.88);backdrop-filter:blur(10px);font-size:13px;opacity:0;pointer-events:none;transition:all .25s;max-width:86%;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%)}
#dlg{position:absolute;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.5);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
#dlg .box{width:min(300px,86%);padding:22px 20px 16px;border-radius:18px;background:#fff;color:var(--txt);text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.4)}
#dlg p{font-size:15px;font-weight:600;margin-bottom:16px;line-height:1.5}
#dlg .btns{display:flex;gap:10px}
#dlg .btns button{flex:1;padding:11px;border-radius:12px;font-size:14px;background:#eef2f7;color:var(--txt)}
#dlg .btns button.ok{background:var(--bad);color:#fff}

@media(max-width:520px){
  .chip .lbl{display:none}
  button.chip,.chip.ic-only{padding:0 11px}
  .brand h1{font-size:26px}
}
</style>
</head>
<body>

<!-- 登录 -->
<div id="setup">
  <div class="card">
    <div class="brand">
      <div class="mark"><i data-ic="cloud"></i></div>
      <h1>坐看云起</h1>
      <p>行到水穷处，坐看云起时</p>
    </div>

    <div class="field">
      <label for="room">房间号（双方填一样）</label>
      <div class="row">
        <input id="room" placeholder="例如 movie123" autocomplete="off" spellcheck="false">
        <button class="ghost" id="btnRand">随机</button>
      </div>
    </div>

    <div class="field">
      <label>我的角色</label>
      <div class="seg">
        <button id="bh" class="on">主播<small>我有视频文件</small></button>
        <button id="bg">观众<small>加入好友的房间</small></button>
      </div>
    </div>

    <div class="field" id="pwdBox">
      <label for="hostPwd">主播密码（验证后本设备 30 天内免输入）</label>
      <input type="password" id="hostPwd" placeholder="验证主播身份后才能开播" autocomplete="current-password">
    </div>

    <div class="drop" id="fileBox"><i data-ic="film"></i><span>点击选择视频文件</span><small>或拖到这里</small></div>
    <input type="file" id="filePick" accept="video/*,.mkv" class="hidden">

    <button id="goBtn" disabled>进入房间</button>
    <p class="err" id="errMsg"></p>
    <p class="tip">主播选好视频进房后，点右上角「邀请」把链接发给好友，<br>对方打开即可直接加入。</p>
  </div>
</div>

<!-- 播放 -->
<div id="player" class="hidden">
  <video id="v" playsinline></video>
  <div id="hint" class="hidden"><i data-ic="cloud"></i><span id="hintText"></span></div>
  <button id="tap" class="hidden"><i data-ic="play" data-fill></i>点击开始观看</button>

  <div class="top">
    <div class="pill"><i class="dot" id="dot"></i><span id="statusText">初始化…</span></div>
    <div class="grp">
      <span class="chip" id="peerBadge"></span>
      <button class="chip" id="btnInvite" title="复制邀请链接"><i data-ic="link"></i><span class="lbl">邀请</span></button>
      <button class="chip" id="btnLeave" title="退出房间"><i data-ic="exit"></i><span class="lbl">退出</span></button>
    </div>
  </div>

  <div class="bottom">
    <input type="range" id="prog" min="0" max="1" step="0.1" value="0">
    <div class="ctrl">
      <button id="btnPlay" title="播放/暂停 (空格)"></button>
      <span id="clock">0:00 / 0:00</span>
      <span class="sp"></span>
      <button id="btnMute" class="g-only" title="静音 (M)"></button>
      <button id="btnSwap" class="h-only txt" title="更换视频"><i data-ic="swap"></i>换片</button>
      <button id="btnFs" title="全屏 (F)"><i data-ic="full"></i></button>
    </div>
  </div>
  <div id="toast"></div>
<div id="dlg" class="hidden"><div class="box"><p id="dlgMsg"></p><div class="btns"><button id="dlgNo">取消</button><button id="dlgYes" class="ok">退出</button></div></div></div>
  <input type="file" id="swapPick" accept="video/*,.mkv" class="hidden">
</div>

<script>
// ═════════ 配置 ═════════


// 默认 ICE：STUN + 公共 TURN（不稳定，建议配合 /api/turn 使用 Cloudflare TURN）
const DEFAULT_ICE = [
  { urls: ['stun:stun.cloudflare.com:3478', 'stun:stun.l.google.com:19302'] },
  { urls: ['turn:openrelay.metered.ca:80', 'turn:openrelay.metered.ca:443',
           'turns:openrelay.metered.ca:443?transport=tcp'],
    username: 'openrelayproject', credential: 'openrelayproject' },
];

// ═════════ 图标 ═════════
const P = {
  play:  '<path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/>',
  pause: '<rect x="6" y="5" width="4" height="14" rx="1.2"/><rect x="14" y="5" width="4" height="14" rx="1.2"/>',
  vol:   '<path d="M11 5 6 9H3v6h3l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/>',
  mute:  '<path d="M11 5 6 9H3v6h3l5 4V5z"/><path d="m16 9 5 6m0-6-5 6"/>',
  full:  '<path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/>',
  link:  '<path d="M10 14a4 4 0 0 0 5.66 0l3-3a4 4 0 0 0-5.66-5.66l-1 1"/><path d="M14 10a4 4 0 0 0-5.66 0l-3 3a4 4 0 0 0 5.66 5.66l1-1"/>',
  exit:  '<path d="M9 4H5a1 1 0 0 0-1 1v14a1 1 0 0 0 1 1h4"/><path d="m16 8 4 4-4 4M20 12H9"/>',
  swap:  '<path d="M4 8h13l-3-3M20 16H7l3 3"/>',
  users: '<circle cx="9" cy="8" r="3.2"/><path d="M3 19a6 6 0 0 1 12 0"/><path d="M16 5.2a3.2 3.2 0 0 1 0 5.6M18 14.5a6 6 0 0 1 3 4.5"/>',
  cloud: '<path d="M7 18a4 4 0 0 1-.6-7.95A5.5 5.5 0 0 1 17 9.5a4.2 4.2 0 0 1 .5 8.5H7z"/>',
  film:  '<rect x="4" y="4" width="16" height="16" rx="3"/><path d="M10 9.5v5l4.2-2.5L10 9.5z"/>',
};
const ic = (n, fill) => `<svg class="ic${fill ? ' fill' : ''}" viewBox="0 0 24 24">${P[n]}</svg>`;
document.querySelectorAll('i[data-ic]').forEach(el => { el.innerHTML = ic(el.dataset.ic, el.hasAttribute('data-fill')); });

// ═════════ 全局状态 ═════════
const $ = id => document.getElementById(id);
const SID = (crypto.randomUUID ? crypto.randomUUID() : Math.random().toString(36).slice(2) + Date.now().toString(36)).slice(0, 12);
const v = $('v'), player = $('player'), prog = $('prog'), clock = $('clock');
const roomEl = $('room'), goBtn = $('goBtn'), errMsg = $('errMsg');
$('btnPlay').innerHTML = ic('play', true);
$('btnMute').innerHTML = ic('vol');

let role = 'host', room = '', rid = '';
let hostTicket = '', authCache = null;
let ably = null, channel = null, outCh = null, ICE = DEFAULT_ICE;
const ui = { sig: false, route: '', msg: '' };
let inPlayer = false, dragging = false, idleT = null;

// 主播
const peers = new Map();
let hostFile = null, fileName = '', vurl = '';
let hostStream = null, usingCanvas = false, hostStreamReady = false;

// 观众
let G = null, gN = 0, gPhase = 'idle', hostSid = '', hostSeenAt = 0, gTimer = null;
let gs = { p: true, c: 0, d: 0, at: 0 };

// ═════════ 工具 ═════════
const fmt = s => {
  if (!isFinite(s) || s < 0) s = 0;
  s = Math.floor(s);
  const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), ss = String(s % 60).padStart(2, '0');
  return h ? `${h}:${String(m).padStart(2, '0')}:${ss}` : `${m}:${ss}`;
};
let toastT = null;
function toast(t) {
  const el = $('toast'); el.textContent = t; el.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('show'), 2200);
}
function showHint(t) { $('hintText').textContent = t; $('hint').classList.remove('hidden'); }
function hideHint() { $('hint').classList.add('hidden'); }

function loadScript(src) {
  return new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = src; s.onload = res; s.onerror = () => rej(new Error('load fail'));
    document.head.appendChild(s);
  });
}
async function loadAbly() {
  if (window.Ably) return;
  for (const u of ['https://cdn.ably.com/lib/ably.min-1.js',
                   'https://cdn.jsdelivr.net/npm/ably@1/browser/static/ably.min.js']) {
    try { await loadScript(u); if (window.Ably) return; } catch {}
  }
  throw new Error('信令库加载失败，请检查网络后刷新重试');
}
async function roomId(r) {
  try {
    const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('zwgy:' + r));
    return [...new Uint8Array(b)].slice(0, 12).map(x => x.toString(16).padStart(2, '0')).join('');
  } catch { return r; }
}
async function loadIce() {
  try {
    const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), 3000);
    const r = await fetch('/api/turn', { signal: ctl.signal, cache: 'no-store' });
    clearTimeout(t);
    if (r.ok) {
      const j = await r.json();
      const s = [].concat(j.iceServers || []).map(x => ({
        ...x, urls: [].concat(x.urls).filter(u => !/:53(\?|$)/.test(u))
      })).filter(x => x.urls.length);
      if (s.length) return s.concat([{ urls: 'stun:stun.l.google.com:19302' }]);
    }
  } catch {}
  return DEFAULT_ICE;
}
async function routeType(pc) {
  try {
    const st = await pc.getStats(); let pair;
    st.forEach(r => { if (r.type === 'transport' && r.selectedCandidatePairId) pair = st.get(r.selectedCandidatePairId); });
    if (!pair) st.forEach(r => { if (r.type === 'candidate-pair' && r.nominated && r.state === 'succeeded') pair = r; });
    if (!pair) return '';
    const l = st.get(pair.localCandidateId), m = st.get(pair.remoteCandidateId);
    return (l && l.candidateType === 'relay') || (m && m.candidateType === 'relay') ? '中继' : '直连';
  } catch { return ''; }
}

// ═════════ 登录页 ═════════
function parseHash() { const m = location.hash.match(/[#&]r=([^&]+)/); return m ? decodeURIComponent(m[1]) : ''; }
function setRole(r) {
  role = r;
  $('bh').className = r === 'host' ? 'on' : '';
  $('bg').className = r === 'guest' ? 'on' : '';
  $('fileBox').classList.toggle('hidden', r !== 'host');
  $('pwdBox').classList.toggle('hidden', r !== 'host');
  updateGo();
}
function updateGo() { goBtn.disabled = !roomEl.value.trim() || (role === 'host' && (!hostFile || !(hostTicket || $('hostPwd').value))); }
function pickFile(f) {
  if (!f) return;
  hostFile = f;
  $('fileBox').classList.add('has');
  $('fileBox').innerHTML = ic('film') + '<span>' + f.name.replace(/&/g, '&amp;').replace(/</g, '&lt;') + '</span><small>点击可重新选择</small>';
  updateGo();
}
$('bh').onclick = () => setRole('host');
$('bg').onclick = () => setRole('guest');
$('btnRand').onclick = () => { roomEl.value = 'zw' + Math.random().toString(36).slice(2, 8); updateGo(); };
roomEl.addEventListener('input', updateGo);
$('hostPwd').addEventListener('input', updateGo);
$('hostPwd').addEventListener('keydown', e => { if (e.key === 'Enter' && !goBtn.disabled) go(); });
roomEl.addEventListener('keydown', e => { if (e.key === 'Enter' && !goBtn.disabled) go(); });
$('fileBox').onclick = () => $('filePick').click();
$('filePick').onchange = e => pickFile(e.target.files[0]);
goBtn.onclick = go;

window.addEventListener('dragover', e => e.preventDefault());
window.addEventListener('drop', e => {
  e.preventDefault();
  const f = e.dataTransfer.files[0];
  if (!f) return;
  if (!inPlayer && role === 'host') pickFile(f);
  else if (inPlayer && role === 'host') swapFile(f);
});

(function init() {
  const hr = parseHash(); let saved = {};
  try { saved = JSON.parse(localStorage.getItem('zwgy') || '{}'); } catch {}
  roomEl.value = hr || saved.room || '';
  try { hostTicket = localStorage.getItem('zwgy_t') || ''; } catch {}
  if (hostTicket) $('hostPwd').placeholder = '本设备已验证，可留空';

async function go() {

// ═════════ 信令（Ably）═════════
async function fetchAuth() {
  const body = { role, rid, cid: SID };
  if (role === 'host') { if (hostTicket) body.ticket = hostTicket; else body.password = $('hostPwd').value; }
  let r;
  try { r = await fetch('/api/auth', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body), cache: 'no-store' }); }
  catch { throw new Error('无法连接鉴权服务，请检查网络'); }
  if (r.status === 401) {
    if (hostTicket) {
      hostTicket = ''; try { localStorage.removeItem('zwgy_t'); } catch {}
      $('hostPwd').placeholder = '验证主播身份后才能开播'; updateGo();
      throw new Error('主播身份已过期，请重新输入密码');
    }
    throw new Error('主播密码不正确');
  }
  if (!r.ok) throw new Error('鉴权服务异常（' + r.status + '），请检查 /api/auth 与环境变量是否已部署');
  let j; try { j = await r.json(); } catch { throw new Error('鉴权服务返回异常'); }
  if (j.ticket) { hostTicket = j.ticket; try { localStorage.setItem('zwgy_t', j.ticket); } catch {} }
  return j.tokenRequest;
}
async function preAuth() { rid = await roomId(room); authCache = await fetchAuth(); }
async function startSignal() {
  await loadAbly();
  rid = await roomId(room);
  ably = new Ably.Realtime({
    authCallback: (params, cb) => {
      if (authCache) { const t = authCache; authCache = null; return cb(null, t); }
      fetchAuth().then(t => cb(null, t), e => cb(String(e.message || e)));   // Token 到期自动续签
    },
    clientId: SID, echoMessages: false, closeOnUnload: true,
    disconnectedRetryTimeout: 2000, suspendedRetryTimeout: 8000,
  });
  ably.connection.on(ch => {
    ui.sig = ch.current === 'connected';
    if (ui.sig && role === 'host') sig('host-hello');
    render();
  });
  await new Promise((res, rej) => {
    const to = setTimeout(() => rej(new Error('信令连接超时，请检查网络')), 12000);
    ably.connection.once('connected', () => { clearTimeout(to); res(); });
    ably.connection.once('failed', e => { clearTimeout(to); rej(new Error('信令连接失败：' + ((e && e.reason && e.reason.message) || '密钥无效'))); });
  });
  // :h = 主播发给观众，:g = 观众发给主播；频道前缀 zw: 需与 Ably Key 的频道限制一致
  channel = ably.channels.get('zw:' + rid + (role === 'host' ? ':g' : ':h'));   // 订阅
  outCh = ably.channels.get('zw:' + rid + (role === 'host' ? ':h' : ':g'));     // 发布
  channel.subscribe(msg => onSig(msg.name, msg.data || {}, msg.clientId));
}
function sig(name, data) {
  if (!outCh) return;
  outCh.publish(name, Object.assign({ from: SID }, data || {}), () => {});
}
function onSig(name, m, cid) {
  if (m.from === SID) return;
  if (cid && m.from !== cid) return;   // from 与 Ably 认证的 clientId 不一致，视为伪造
  if (role === 'host') {
    if (m.to !== SID) return;
    if (name === 'guest-hello') hostOnHello(m);
    else if (name === 'guest-answer') hostOnAnswer(m);
    else if (name === 'guest-ice') hostOnIce(m);
    else if (name === 'guest-bye') dropPeer(m.from);
  } else {
    if (name === 'host-hello') guestOnHello(m);
    else if (name === 'host-offer') guestOnOffer(m);
    else if (name === 'host-ice') guestOnIce(m);
    else if (name === 'host-bye' && m.from === hostSid) { hostSeenAt = 0; guestRestart('主播已离开'); }
  }
}

// 远端描述 + 候选排队
async function applyRemote(p, desc) {
  await p.pc.setRemoteDescription(desc);
  p.ready = true;
  for (const c of p.q) await p.pc.addIceCandidate(c).catch(() => {});
  p.q.length = 0;
}
function addCand(p, c) {
  if (!p || !c) return;
  if (p.ready) p.pc.addIceCandidate(c).catch(() => {}); else p.q.push(c);
}

// ═════════ 主播端 ═════════
function loadVideo(file) {
  return new Promise((res, rej) => {
    if (vurl) URL.revokeObjectURL(vurl);
    vurl = URL.createObjectURL(file); fileName = file.name;
    const clean = () => { v.removeEventListener('loadedmetadata', ok); v.removeEventListener('error', bad); };
    const ok = () => { clean(); res(); };
    const bad = () => { clean(); rej(new Error('浏览器无法播放这个视频，建议转成 MP4（H.264 + AAC）')); };
    v.addEventListener('loadedmetadata', ok);
    v.addEventListener('error', bad);
    v.src = vurl;

}
function swapFile(f) {

}
$('btnSwap').onclick = () => $('swapPick').click();
$('swapPick').onchange = e => { swapFile(e.target.files[0]); e.target.value = ''; };

function buildCanvasStream() {
  const cv = document.createElement('canvas');

  const ctx = cv.getContext('2d');
  setInterval(() => {
    if (v.videoWidth && (cv.width !== v.videoWidth || cv.height !== v.videoHeight)) { cv.width = v.videoWidth; cv.height = v.videoHeight; }
    if (v.readyState >= 2) ctx.drawImage(v, 0, 0, cv.width, cv.height);
  }, 33);
  const vs = cv.captureStream(30);
  const AC = window.AudioContext || window.webkitAudioContext;
  const ac = new AC();
  const src = ac.createMediaElementSource(v);     // 整个页面生命周期只创建一次
  const dest = ac.createMediaStreamDestination();
  src.connect(dest); src.connect(ac.destination);
  v.addEventListener('play', () => { if (ac.state === 'suspended') ac.resume(); });
  return new MediaStream([...vs.getVideoTracks(), ...dest.stream.getAudioTracks()]);
}

  const cap = v.captureStream || v.mozCaptureStream;

}
function initHostStream() {
  if (usingCanvas && hostStream) { hostStreamReady = true; return; }
  try { hostStream = nativeCapture(); } catch { hostStream = null; }
  if (!hostStream) { usingCanvas = true; hostStream = buildCanvasStream(); }
  hostStream.onaddtrack = syncAllPeers;
  hostStreamReady = true;
}
function refreshHostStream() {      // 换片后
  if (!usingCanvas) {
    try { hostStream = nativeCapture() || hostStream; hostStream.onaddtrack = syncAllPeers; } catch {}
  }
  syncAllPeers();
}
const liveTrack = kind => (hostStream && hostStream.getTracks().find(t => t.kind === kind && t.readyState === 'live')) || null;
function syncPeer(p) {
  p.vs.replaceTrack(liveTrack('video')).catch(() => {});
  p.as.replaceTrack(liveTrack('audio')).catch(() => {});
}
function syncAllPeers() { peers.forEach(syncPeer); }
async function tuneSender(s) {
  try { if (s.track) s.track.contentHint = 'motion'; } catch {}
  try {
    const q = s.getParameters();
    if (q.encodings && q.encodings.length) {
      const h = s.track && s.track.getSettings ? (s.track.getSettings().height || 0) : 0;
      q.encodings[0].scaleResolutionDownBy = h > 1080 ? h / 1080 : 1;
    }
    q.degradationPreference = 'balanced';
    await s.setParameters(q);
  } catch {}
  try {
    const p = s.getParameters();
    if (!p.encodings || !p.encodings.length) p.encodings = [{}];
    p.encodings[0].maxBitrate = 3000000;
    await s.setParameters(p);
  } catch {}
}
function kick() { try { v.currentTime = Math.min(v.duration || 0, v.currentTime + 0.001); } catch {} }  // 暂停时推一帧，避免新观众黑屏

function startHost() {
  hideHint();
  sig('host-hello');
  loops.push(setInterval(() => sig('host-hello'), 3000));
  loops.push(setInterval(() => { render(); broadcast(); }, 1000));
  render(); syncPlayUI();
}
const stateMsg = () => JSON.stringify({ t: 'state', p: v.paused, c: v.currentTime || 0, d: isFinite(v.duration) ? v.duration : 0, n: fileName });
function broadcast() {
  if (role !== 'host' || !peers.size) return;
  const s = stateMsg();
  peers.forEach(p => { if (p.dc && p.dc.readyState === 'open') try { p.dc.send(s); } catch {} });
}
async function hostOnHello(m) {
  const sid = m.from, n = m.n | 0, old = peers.get(sid);

  if (old) dropPeer(sid);
  await createPeer(sid, n);
}
async function createPeer(sid, n) {
  const pc = new RTCPeerConnection({ iceServers: ICE, bundlePolicy: 'max-bundle' });
  const p = { sid, n, pc, dc: null, q: [], ready: false, up: false, dt: null };
  peers.set(sid, p);
  const out = new MediaStream();
  p.vs = pc.addTransceiver('video', { direction: 'sendonly', streams: [out] }).sender;
  p.as = pc.addTransceiver('audio', { direction: 'sendonly', streams: [out] }).sender;
  syncPeer(p);

  p.dc = pc.createDataChannel('ctrl');
  p.dc.onopen = () => { try { p.dc.send(stateMsg()); } catch {} };
  p.dc.onclose = () => { if (peers.get(sid) === p) dropPeer(sid); };

  pc.onicecandidate = e => { if (e.candidate) sig('host-ice', { to: sid, n, c: e.candidate.toJSON() }); };
  pc.onconnectionstatechange = () => {

      if (v.paused) setTimeout(kick, 300);

    } else if (s === 'disconnected') {

async function hostOnAnswer(m) {

// ═════════ 观众端 ═════════
function startGuest() {
  showHint('等待主播上线…');
  loops.push(setInterval(() => { render(); resumeIfStuck(); }, 2000));
  render(); syncPlayUI();
}
const hostFresh = () => Date.now() - hostSeenAt < 9000;
function guestOnHello(m) {
  hostSeenAt = Date.now();
  if (m.from !== hostSid) {
    const had = hostSid; hostSid = m.from;
    if (had && gPhase !== 'idle') { guestRestart('主播已更换'); return; }
  }
  if (gPhase === 'idle') guestHello(); else render();
}
function guestHello() {
  if (!hostSid) return;
  gPhase = 'negotiating'; ui.msg = '正在连接主播…';
  clearTimeout(gTimer);
  gTimer = setTimeout(() => { if (gPhase !== 'connected') guestRestart('连接超时'); }, 20000);
  sig('guest-hello', { to: hostSid, n: gN });
  render();
}
function closeG() {
  if (!G) return;
  const g = G; G = null; clearTimeout(g.dt);
  const pc = g.pc;
  pc.ontrack = pc.onicecandidate = pc.onconnectionstatechange = pc.ondatachannel = null;
  if (g.dc) g.dc.onclose = g.dc.onmessage = g.dc.onopen = null;
  try { pc.close(); } catch {}

}
function guestRestart(reason) {

  gN++; gPhase = 'idle'; ui.route = ''; ui.msg = reason + '，重新连接…';
  showHint('重新连接中…'); $('tap').classList.add('hidden');
  render();
  setTimeout(() => { if (gPhase === 'idle' && hostFresh()) guestHello(); }, 1000);
}
async function guestOnOffer(m) {
  if (m.to !== SID || m.from !== hostSid || m.n !== gN || gPhase !== 'negotiating' || G) return;
  const pc = new RTCPeerConnection({ iceServers: ICE, bundlePolicy: 'max-bundle' });
  const rs = new MediaStream();
  const g = G = { pc, n: gN, q: [], ready: false, rs, dc: null, dt: null };
  v.srcObject = rs;

  pc.ontrack = e => { rs.addTrack(e.track); tryPlay(); };
  pc.ondatachannel = e => {
    g.dc = e.channel;
    g.dc.onmessage = ev => {
      try { const s = JSON.parse(ev.data); if (s.t === 'state') { gs = { p: s.p, c: s.c, d: s.d, at: performance.now() }; syncPlayUI(); tick(); } } catch {}
    };

  };
  pc.onicecandidate = e => { if (e.candidate) sig('guest-ice', { to: hostSid, n: g.n, c: e.candidate.toJSON() }); };

    const s = pc.connectionState;
    if (s === 'connected') {

    }

}
function tryPlay() {

    .catch(e => { if (e && e.name === 'NotAllowedError') $('tap').classList.remove('hidden'); });
}
$('tap').onclick = () => { v.muted = false; v.play().then(() => $('tap').classList.add('hidden')).catch(() => {}); };
v.addEventListener('playing', () => { if (role === 'guest') { hideHint(); $('tap').classList.add('hidden'); } });

// ═════════ 状态栏 ═════════
function render() {
  if (!inPlayer) return;
  let c = 'yellow', t = '';
  const pb = $('peerBadge');
  if (role === 'host') {
    const n = viewerCount();
    if (!ui.sig) { c = n ? 'yellow' : 'red'; t = n ? `信令断线重连中（${n} 人观看不受影响）` : '信令断线，重连中…'; }
    else if (!n) { c = 'yellow'; t = '等待好友加入…'; }

  } else {

    else if (!ui.sig) { c = 'red'; t = '信令断线，重连中…'; }
    else if (!hostFresh()) { t = '等待主播上线…'; }

// ═════════ 播放控制（仅主播可控）═════════

// 快捷键
document.addEventListener('keydown', e => {
  if (!inPlayer || /INPUT|TEXTAREA/.test(document.activeElement.tagName) && document.activeElement !== prog) return;
  const k = e.key;
  if (k === ' ' || k === 'k') { e.preventDefault(); togglePlay(); }
  else if (k === 'ArrowLeft') { e.preventDefault(); act('seek', Math.max(0, curTime().c - 10)); }
  else if (k === 'ArrowRight') { e.preventDefault(); act('seek', curTime().c + 10); }
  else if (k === 'f' || k === 'F') toggleFS();
  else if ((k === 'm' || k === 'M') && role === 'guest') $('btnMute').click();
});
</script>
</body>
</html>
